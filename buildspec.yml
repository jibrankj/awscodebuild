version: 0.2

env:
  variables:
    AWS_REGION: us-east-1
    ECR_REPO: spring-demo
    ECS_CLUSTER: spring-ecs-cluster
    ECS_SERVICE: mytask-service
    TASK_DEF_FAMILY: mytask

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo Getting AWS account ID
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin https://$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - echo Ensuring ECR repository exists
      - aws ecr describe-repositories --repository-names $ECR_REPO --region $AWS_REGION || aws ecr create-repository --repository-name $ECR_REPO --region $AWS_REGION
  
  
  build:
    commands:
      - echo Build Spring Boot app
      - cd hello-gkc
      - mvn clean package

      - echo Build Docker image
      - docker build -t $ECR_REPO .

      - echo Tag Docker image
      - docker tag $ECR_REPO:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest

  post_build:
    commands:
      - echo Pushing Docker image to ECR
      - docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest

      - echo Generating a new ECS task definition with the latest image URI
      - TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition $TASK_DEF_FAMILY --region $AWS_REGION)
      
      - NEW_TASK_DEF=$(echo $TASK_DEF_JSON | jq --arg IMAGE "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest" '.taskDefinition | .containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
      
      - echo Registering new task definition revision
      - NEW_TASK_INFO=$(aws ecs register-task-definition --region $AWS_REGION --cli-input-json "$NEW_TASK_DEF")
      - NEW_REVISION=$(echo $NEW_TASK_INFO | jq '.taskDefinition.revision')

      - echo Updating Amazon ECS Service to use the new revision
      - aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --task-definition $TASK_DEF_FAMILY:$NEW_REVISION --force-new-deployment --region $AWS_REGION
  
  
artifacts:
  files:
    - '**/*'
